name: Refresh profile stats

on:
  schedule:
    - cron: '15 3 * * *' # 08:45 India time
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'profile-stats/*.mjs'

permissions:
  contents: write

concurrency:
  group: profile-stats

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check and refresh the README stats
        run: |
          node --test profile-stats/stats.test.mjs
          node profile-stats/refresh-snapshot.mjs
      - name: Publish any changes
        run: |
          git add -- README.md profile-stats/snapshot.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh profile stats'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
